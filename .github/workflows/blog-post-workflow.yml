name: Update README feeds

on:
  schedule:
    # Daily at 11:00 PM America/Chicago during CDT (UTC-5) → 04:00 UTC.
    # During CST (UTC-6) this is 10:00 PM local; GitHub cron is UTC-only.
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update-readme-feeds:
    name: Update README with Medium posts and YouTube videos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Latest Medium posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@alok.ch83"
          max_post_count: "5"
          comment_tag_name: "BLOG-POST-LIST"

      - name: Sync after Medium commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master

      - name: Latest Worth Knowing TV (long-form + Shorts)
        run: python3 .github/scripts/update_youtube_readme.py

      - name: Commit YouTube README updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Worth Knowing TV long-form and Shorts"
          file_pattern: README.md
          branch: master
